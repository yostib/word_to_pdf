<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access - Word to PDF Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-wrapper {
            max-width: 440px;
            width: 100%;
        }
        
        .brand {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .brand-icon {
            background: white;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .brand h2 {
            color: white;
            font-size: 28px;
            font-weight: bold;
        }
        
        .brand p {
            color: rgba(255,255,255,0.8);
            margin-top: 8px;
        }
        
        .login-card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .login-header h3 {
            font-size: 24px;
            color: #1f2937;
            margin-bottom: 8px;
        }
        
        .login-header p {
            color: #6b7280;
            font-size: 14px;
        }
        
        .input-group {
            margin-bottom: 24px;
        }
        
        .input-label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 500;
            font-size: 14px;
        }
        
        .input-icon {
            position: relative;
        }
        
        .input-icon span {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
        }
        
        .input-icon input {
            width: 100%;
            padding: 14px 16px 14px 45px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.2s;
            background: #f9fafb;
        }
        
        .input-icon input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 12px;
            margin-top: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .error-message::before {
            content: "⚠️";
        }
        
        .success-message {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #16a34a;
            padding: 12px 16px;
            border-radius: 12px;
            margin-top: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .success-message::before {
            content: "✓";
            font-weight: bold;
        }
        
        .security-badge {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #e5e7eb;
            font-size: 12px;
            color: #9ca3af;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        
        .security-badge span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .shake {
            animation: shake 0.3s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="brand">
            <div class="brand-icon">
                📄✨
            </div>
            <h2>Word to PDF Converter</h2>
            <p>Free • Fast • No Signup</p>
        </div>
        
        <div class="login-card">
            <div class="login-header">
                <h3>🔐 Admin Access</h3>
                <p>Enter your credentials to access analytics</p>
            </div>
            
            <form id="loginForm">
                <div class="input-group">
                    <label class="input-label">Username</label>
                    <div class="input-icon">
                        <span>👤</span>
                        <input type="text" id="username" placeholder="admin" autocomplete="off">
                    </div>
                </div>
                
                <div class="input-group">
                    <label class="input-label">Password</label>
                    <div class="input-icon">
                        <span>🔒</span>
                        <input type="password" id="password" placeholder="••••••••">
                    </div>
                </div>
                
                <button type="submit" class="login-btn" id="loginBtn">
                    Access Dashboard →
                </button>
            </form>
            
            <div id="messageContainer"></div>
            
            <div class="security-badge">
                <span>🔒 256-bit SSL</span>
                <span>🛡️ Rate Limited</span>
                <span>📊 Real-time Stats</span>
            </div>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const messageContainer = document.getElementById('messageContainer');

        function showMessage(type, text) {
            messageContainer.innerHTML = `<div class="${type}-message">${text}</div>`;
            setTimeout(() => {
                if (messageContainer.innerHTML.includes(text)) {
                    messageContainer.innerHTML = '';
                }
            }, 3000);
        }

        function showError(text) {
            showMessage('error', text);
            const card = document.querySelector('.login-card');
            card.classList.add('shake');
            setTimeout(() => card.classList.remove('shake'), 300);
        }

        async function handleLogin(e) {
            e.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username || !password) {
                showError('Please enter both username and password');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Verifying credentials...';

            try {
                const response = await fetch('/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    showMessage('success', '✓ Authentication successful! Redirecting...');
                    setTimeout(() => {
                        window.location.href = '/admin/dashboard';
                    }, 700);
                } else if (response.status === 401) {
                    showError('Invalid username or password. Please try again.');
                    passwordInput.value = '';
                    passwordInput.focus();
                } else {
                    showError('Server error. Please try again later.');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Network error. Please check your connection.');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Access Dashboard →';
            }
        }

        form.addEventListener('submit', handleLogin);
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                form.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
